<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Plant Oasis</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7d5b9c692b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="plants.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 70px;
        }
        .navbar {
            background-color: #1e4620 !important;
        }
        .cart-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .quantity-btn {
            padding: 2px 8px;
            font-size: 0.9rem;
        }
    </style>
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top" >
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-leaf text-warning me-2"></i>Plant Oasis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-semibold align-itmes-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="IndoorPlants.html">Indoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="OutDoorPlant.html">Outdoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="FloweringPlants.html">Flowering</a></li>
                    <li class="nav-item"><a class="nav-link" href="Tree.html">Trees</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a href="Wishlist.html" class="nav-link position-relative d-inline-block p-0" title="Wishlist" style="line-height: 1;">  
                            <div class="wishlist-nav-icon">
                                <i class="fa-solid fa-heart"></i>
                            </div>
                            <span id="wishlist-badge" class="position-absolute badge rounded-pill bg-danger fw-bold d-none" 
                                style="font-size: 0.65rem; padding: 0.25em 0.45em; top: -5px; right: -5px; z-index: 5; border: 1px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                                0
                            </span>
                        </a>
                    </li>
                    <!-- 🛒 SHOPPING CART ICON (Home page ke navbar me links ke baad jodna hai) -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0 ">  
                        <a href="Cart.html" class="text-white position-relative fs-5" id="cart-icon">
                            <i class="fas fa-shopping-cart text-warning"></i>
                            <!-- 🔴 Cart Counter Badge -->
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger " style="font-size: 0.5rem;">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container pt-5 mt-5">
        <h2 class="fw-bold text-success mb-4"><i class="fa-solid fa-basket-shopping me-2"></i>Shopping Cart</h2>
        
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-4">
                    <div id="empty-cart-msg" class="text-center py-5 d-none">
                        <i class="fa-solid fa-folder-open text-muted display-1 mb-3"></i>
                        <h4 class="text-muted">Your cart is empty!</h4>
                        <a href="IndoorPlants.html" class="btn btn-success mt-3 rounded-pill">Shop Plants Now</a>
                    </div>

                    <div class="table-responsive" id="cart-table-container">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Plant</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th class="text-center">Quantity</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-4 bg-white text-dark">
                    <h4 class="fw-bold mb-4">Order Summary</h4>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-bold" id="subtotal-amount">₹0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Delivery Charges</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Grand Total</span>
                        <span class="fs-5 fw-bold text-success" id="grand-total-amount">₹0</span>
                    </div>
                    <a href="Checkout.html" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow d-flex align-items-center justify-content-center" id="checkout-btn">
                        Proceed to Checkout <i class="fa-solid fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- 1. Elements Selectors ---
        const cartItemsBody = document.getElementById('cart-items-body');
        const emptyCartMsg = document.getElementById('empty-cart-msg');
        const cartTableContainer = document.getElementById('cart-table-container');
        const subtotalAmount = document.getElementById('subtotal-amount');
        const grandTotalAmount = document.getElementById('grand-total-amount');
        const checkoutBtn = document.getElementById('checkout-btn');
        const cartCountElement = document.getElementById('cart-count');
        const wishlistBadge = document.getElementById('wishlist-badge');

        // --- 2. Data Fetch ---
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('plantWishlist')) || [];

        // --- 3. Badge Update Functions ---
        function updateNavbarBadges() {
            // Cart Update
            let totalCount = cart.reduce((total, item) => total + (item.quantity || 1), 0);
            if (cartCountElement) {
                cartCountElement.innerText = totalCount;
            }

            // Wishlist Update
            if (wishlistBadge) {
                wishlistBadge.textContent = wishlist.length;
                wishlistBadge.classList.toggle('d-none', wishlist.length === 0);
            }
        }

        // --- 4. Render Cart Table ---
        function renderCart() {
            updateNavbarBadges();

            if (cart.length === 0) {
                if (emptyCartMsg) emptyCartMsg.classList.remove('d-none');
                if (cartTableContainer) cartTableContainer.classList.add('d-none');
                if (checkoutBtn) checkoutBtn.classList.add('disabled', 'opacity-50');
                
                if (subtotalAmount) subtotalAmount.innerText = "₹0";
                if (grandTotalAmount) grandTotalAmount.innerText = "₹0";
                return;
            } else {
                if (checkoutBtn) checkoutBtn.classList.remove('disabled', 'opacity-50');
            }

            if (emptyCartMsg) emptyCartMsg.classList.add('d-none');
            if (cartTableContainer) cartTableContainer.classList.remove('d-none');
            
            cartItemsBody.innerHTML = '';
            let totalBill = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                totalBill += itemTotal;

                const row = `
                    <tr>
                        <td><img src="${item.img}" class="cart-img" style="width:60px;" alt="${item.title}"></td>
                        <td><h6 class="fw-bold mb-0">${item.title}</h6></td>
                        <td>₹${item.price}</td>
                        <td>
                            <div class="d-flex justify-content-center align-items-center gap-2">
                                <button class="btn btn-outline-secondary btn-sm quantity-btn" data-index="${index}" data-action="decrease">-</button>
                                <span class="fw-bold px-2">${item.quantity}</span>
                                <button class="btn btn-outline-secondary btn-sm quantity-btn" data-index="${index}" data-action="increase">+</button>
                            </div>
                        </td>
                        <td class="fw-bold text-success">₹${itemTotal}</td>
                        <td>
                            <button class="btn btn-outline-danger btn-sm remove-btn" data-index="${index}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                cartItemsBody.innerHTML += row;
            });

            if (subtotalAmount) subtotalAmount.innerText = `₹${totalBill}`;
            if (grandTotalAmount) grandTotalAmount.innerText = `₹${totalBill}`;
        }

        // --- 5. Event Listeners ---
        cartItemsBody.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-btn') || e.target.closest('.remove-btn')) {
                const btn = e.target.classList.contains('remove-btn') ? e.target : e.target.closest('.remove-btn');
                const index = btn.getAttribute('data-index');
                cart.splice(index, 1);
                updateStorageAndRefresh();
            }

            if (e.target.classList.contains('quantity-btn')) {
                const index = e.target.getAttribute('data-index');
                const action = e.target.getAttribute('data-action');

                if (action === 'increase') {
                    cart[index].quantity += 1;
                } else if (action === 'decrease') {
                    if (cart[index].quantity > 1) {
                        cart[index].quantity -= 1;
                    } else {
                        cart.splice(index, 1);
                    }
                }
                updateStorageAndRefresh();
            }
        });

        function updateStorageAndRefresh() {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Initial Call
        renderCart();
    });
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
