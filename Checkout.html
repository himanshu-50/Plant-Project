<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Plant Oasis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="plants.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌿 Plant Oasis</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="IndoorPlants.html">Indoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="OutDoorPlant.html">Outdoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="FloweringPlants.html">Flowering</a></li>
                    <li class="nav-item"><a class="nav-link" href="Tree.html">Trees</a></li>
                     <!-- 🛒 SHOPPING CART ICON (Home page ke navbar me links ke baad jodna hai) -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0 active">  
                        <a href="Cart.html" class="text-white position-relative fs-5" id="cart-icon">
                            <i class="fas fa-shopping-cart text-warning"></i>
                            <!-- 🔴 Cart Counter Badge -->
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger " style="font-size: 0.5rem;">
                            0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-7">
                <div class="card p-4 shadow-sm" style="border-radius: 15px; border: none; background: #ffffff;">
                    <h4 class="fw-bold text-success mb-4"><i class="fa-solid fa-truck"></i> Delivery Address</h4>
                    
                    <form id="checkout-main-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="custName" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="custPhone" placeholder="Enter 10-digit mobile number" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Detailed Address</label>
                            <textarea class="form-control" id="custAddress" rows="3" placeholder="House No., Street, Building, Landmark..." required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">City / Town</label>
                                <input type="text" class="form-control" id="custCity" placeholder="e.g. Ballia / Buxar" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">Pincode</label>
                                <input type="text" class="form-control" id="custPincode" placeholder="6-digit pincode" required>
                            </div>
                        </div>

                        <div class="mb-3 mt-4">
                            <label class="form-label fw-semibold">Payment Method</label>
                            
                            <div class="p-3 border rounded d-flex align-items-center mb-2" style="background: #f8f9fa;">
                                <input type="radio" name="payMode" id="codMode" value="COD" checked style="transform: scale(1.2);">
                                <label class="fw-bold text-secondary ms-3 mb-0" for="codMode">
                                    <i class="fa-solid fa-hand-holding-dollar text-success me-1"></i> Cash on Delivery (COD)
                                </label>
                            </div>

                            <div class="p-3 border rounded d-flex align-items-center mb-3" style="background: #f8f9fa;">
                                <input type="radio" name="payMode" id="onlineMode" value="ONLINE" style="transform: scale(1.2);">
                                <label class="fw-bold text-secondary ms-3 mb-0" for="onlineMode">
                                    <i class="fa-solid fa-credit-card text-primary me-1"></i> Online Payment (UPI / Card)
                                </label>
                            </div>

                            <div id="online-details-box" class="p-3 border rounded d-none" style="background: #f1f3f5; border-left: 4px solid #0d6efd !important;">
                                <p class="fw-bold text-primary mb-2" style="font-size: 0.95rem;">Select Online Option:</p>
                                
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="onlineType" id="upiOption" checked>
                                    <label class="form-check-label" for="upiOption">UPI (PhonePe, Google Pay, PayTM, BHIM)</label>
                                </div>
                                <div class="mb-3 id-input-div">
                                    <input type="text" class="form-control form-control-sm" id="upiIdInput" placeholder="Enter UPI ID (e.g. name@apl)">
                                </div>

                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="onlineType" id="cardOption">
                                    <label class="form-check-label" for="cardOption">Credit / Debit Card</label>
                                </div>
                                <div class="row g-2 id-card-div d-none">
                                    <div class="col-12 mb-2">
                                        <input type="text" class="form-control form-control-sm" id="cardNumber" placeholder="Card Number (16 Digits)">
                                    </div>
                                    <div class="col-6">
                                        <input type="text" class="form-control form-control-sm" id="cardExpiry" placeholder="MM/YY">
                                    </div>
                                    <div class="col-6">
                                        <input type="password" class="form-control form-control-sm" id="cardCvv" placeholder="CVV">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card p-4 shadow-sm" style="border-radius: 15px; border: none; background: #f9fbf9;">
                    <h4 class="fw-bold text-success mb-3"><i class="fa-solid fa-receipt"></i> Order Summary</h4>
                    <hr>
                    
                    <div id="summary-items-box" class="mb-3"></div>
                    
                    <hr>
            
            <div class="mb-4 mt-3 p-3 rounded-4 premium-coupon-box" style="width: 100%; display: block; position: relative; z-index: 5;">
                <label class="form-label fw-bold text-success mb-2" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                    <i class="fa-solid fa-ticket me-1"></i> HAVE A COUPON?
                </label>
                <div class="input-group">
                    <input type="text" id="coupon-input" class="form-control form-control-sm border-success-subtle px-3 py-2" placeholder="e.g. PLANT20" style="text-transform: uppercase; border-radius: 8px 0 0 8px; font-weight: 500;">
                    <button class="btn btn-success btn-sm fw-bold px-3 shadow-sm" type="button" id="apply-coupon-btn" style="border-radius: 0 8px 8px 0;">Apply</button>
                </div>
                <div id="coupon-message" class="form-text fw-semibold mt-2 d-none p-2 rounded" style="font-size: 0.85rem; background-color: rgba(25, 135, 84, 0.05);"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 pt-2 px-1">
                <span class="fw-bold text-secondary" style="font-size: 1.05rem;">Total Amount:</span>
                <span class="fw-extrabold text-dark" style="font-size: 1.3rem;">
                    <i class="fa-solid fa-indian-rupee-sign" style="font-size: 1.1rem;"></i> 
                    <span id="summary-total-price">0</span>
                </span>
            </div>

            <button type="submit" form="checkout-main-form" class="btn btn-success btn-lg w-100 py-2 fw-bold rounded-pill shadow-sm" style="font-size: 1.1rem; letter-spacing: 0.5px;">
                Place Order
            </button>
                   

        </div>
    </div>

    <div class="modal fade" id="successPopup" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius: 20px; border: none;">
                <div class="modal-body">
                    <i class="fa-solid fa-circle-check text-success mb-3" style="font-size: 4.5rem;"></i>
                    <h2 class="fw-bold text-success">Order Placed!</h2>
                    <p class="text-muted mt-2">Thank you, <span id="p-name" class="fw-bold text-dark"></span>! Your plants are on the way.</p>
                    
                    <div class="p-3 bg-light rounded text-start mb-4" style="font-size: 0.9rem; border-left: 4px solid #198754;">
                        <strong>Delivery To:</strong> <br>
                        <span id="p-address" class="text-secondary"></span>
                    </div>
                    
                    <button class="btn btn-success rounded-pill px-5 fw-bold" onclick="endOrder()">Continue Shopping</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const itemsBox = document.getElementById('summary-items-box');
            const totalBox = document.getElementById('summary-total-price');
            const mainForm = document.getElementById('checkout-main-form');

            // LocalStorage से कार्ट का डेटा निकालना
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let grandTotal = 0;

            

            if (cart.length === 0) {
                window.location.href = "Cart.html"; // अगर कार्ट खाली है तो भगाओ यहाँ से
                return;
            }

            // बिल आइटम लिस्ट तैयार करना
            cart.forEach(item => {
                const price = parseFloat(item.price);
                const qty = parseInt(item.quantity) || 1;
                const itemTotal = price * qty;
                grandTotal += itemTotal;

                const row = document.createElement('div');
                row.className = 'd-flex justify-content-between align-items-center mb-2';
                row.innerHTML = `
                    <span class="text-muted">${item.title} <strong class="text-success">x${qty}</strong></span>
                    <span class="fw-semibold"><i class="fa-solid fa-indian-rupee-sign" style="font-size: 0.8rem;"></i> ${itemTotal}</span>
                `;
                itemsBox.appendChild(row);
            });

            totalBox.textContent = grandTotal;

            // --- कूपन कोड का नया लॉजिक ---
            let discountAmount = 0; 
            const couponInput = document.getElementById('coupon-input');
            const applyBtn = document.getElementById('apply-coupon-btn');
            const couponMsg = document.getElementById('coupon-message');

            applyBtn.addEventListener('click', function () {
                const enteredCode = couponInput.value.trim().toUpperCase();

                // कूपन कोड्स की लिस्ट और डिस्काउंट परसेंट (20% और 50%)
                if (enteredCode === 'PLANT20') {
                    discountAmount = grandTotal * 0.20; // 20% डिस्काउंट
                    showCouponMessage(`🎉 Success! 20% discount applied. Saved: ₹${discountAmount.toFixed(0)}`, 'text-success');
                } else if (enteredCode === 'FREE50') {
                    discountAmount = grandTotal * 0.50; // 50% डिस्काउंट
                    showCouponMessage(`🎉 Wow! 50% discount applied. Saved: ₹${discountAmount.toFixed(0)}`, 'text-success');
                } else if (enteredCode === '') {
                    showCouponMessage('Please enter a coupon code.', 'text-warning');
                    return;
                } else {
                    discountAmount = 0; // गलत कोड पर कोई डिस्काउंट नहीं
                    showCouponMessage('❌ Invalid Coupon Code!', 'text-danger');
                }

                // फाइनल बिल को अपडेट करना
                const finalTotal = grandTotal - discountAmount;
                totalBox.textContent = finalTotal.toFixed(0);
            });

            // मैसेज दिखाने के लिए छोटा सा हेल्पफुल फंक्शन
            function showCouponMessage(text, className) {
                couponMsg.textContent = text;
                couponMsg.className = `form-text fw-semibold mt-1 ${className}`;
                couponMsg.classList.remove('d-none');
            }

            // फॉर्म सबमिट हैंडलर
            mainForm.addEventListener('submit', function (e) {
                e.preventDefault();

                const name = document.getElementById('custName').value;
                const phone = document.getElementById('custPhone').value;
                const address = document.getElementById('custAddress').value;
                const city = document.getElementById('custCity').value;
                const pincode = document.getElementById('custPincode').value;

                // पॉपअप में नाम और पता सेट करना
                document.getElementById('p-name').textContent = name;
                document.getElementById('p-address').innerHTML = `${address}, <br>${city} - ${pincode} <br><strong>Mob:</strong> ${phone}`;

                // बूटस्ट्रैप का सक्सेस मॉडल (पॉपअप) खोलना
                const modal = new bootstrap.Modal(document.getElementById('successPopup'));
                modal.show();
            });
        });

        function endOrder() {
            localStorage.removeItem('plantCart'); // ऑर्डर के बाद कार्ट साफ़
            window.location.href = "index.html"; // होम पेज पर रीडायरेक्ट
        }


                // ⚡ ONLINE PAYMENT TOGGLE LOGIC
        const codMode = document.getElementById('codMode');
        const onlineMode = document.getElementById('onlineMode');
        const onlineDetailsBox = document.getElementById('online-details-box');
        const upiOption = document.getElementById('upiOption');
        const cardOption = document.getElementById('cardOption');
        const upiInputDiv = document.querySelector('.id-input-div');
        const cardInputDiv = document.querySelector('.id-card-div');

        // COD और Online रेडियो बटन बदलने पर
        document.querySelectorAll('input[name="payMode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (onlineMode.checked) {
                    onlineDetailsBox.classList.remove('d-none'); // ऑनलाइन बॉक्स दिखाओ
                } else {
                    onlineDetailsBox.classList.add('d-none'); // ऑनलाइन बॉक्स छिपाओ
                }
            });
        });

        // UPI और CARD के अंदर का टॉगल
        document.querySelectorAll('input[name="onlineType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (upiOption.checked) {
                    upiInputDiv.classList.remove('d-none');
                    cardInputDiv.classList.add('d-none');
                } else if (cardOption.checked) {
                    upiInputDiv.classList.add('d-none');
                    cardInputDiv.classList.remove('d-none');
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartBadge = document.getElementById('cart-count');
        
        if (cartBadge) {
            cartBadge.innerText = cart.reduce((total, item) => total + item.quantity, 0);
        }
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
