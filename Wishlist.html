<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Plant Oasis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="plants.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🌿 Plant Oasis</a>
            <button class="navbar-expand-lg navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="IndoorPlants.html">Indoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="OutDoorPlant.html">Outdoor</a></li>
                    <li class="nav-item"><a class="nav-link" href="FloweringPlants.html">Flowering</a></li>
                    <li class="nav-item"><a class="nav-link" href="Tree.html">Trees</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a href="Wishlist.html" class="nav-link position-relative d-inline-block p-0" title="Wishlist" style="line-height: 1;">  
                            <div class="wishlist-nav-icon">
                                <i class="fa-solid fa-heart"></i>
                            </div>
                            <span id="wishlist-badge" class="position-absolute badge rounded-pill bg-danger fw-bold d-none" 
                                style="font-size: 0.65rem; padding: 0.25em 0.45em; top: -5px; right: -5px; z-index: 5; border: 1px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                                0
                            </span>
                        </a>
                    </li>>
                   <!-- 🛒 SHOPPING CART ICON (Yeh navbar ke andar jod diya) -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a href="Cart.html" class="text-white position-relative fs-5" id="cart-icon">
                            <i class="fas fa-shopping-cart"></i>
                            <!-- 🔴 Cart Counter Badge -->
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="min-height: 80vh;">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-success">My Favorite Plants</h2>
            <p class="text-muted">Your curated list of beautiful greens and flowers.</p>
        </div>

        <div class="row g-4" id="wishlist-container"></div>

        <div id="empty-wishlist" class="text-center d-none py-5">
            <i class="fa-regular fa-heart fa-4x text-muted mb-3"></i>
            <h4 class="text-muted">Your wishlist is empty!</h4>
            <p class="text-muted">Explore our collections and add some beautiful plants.</p>
            <a href="index.html" class="btn btn-success rounded-pill px-4 mt-2">Shop Plants</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartBadge = document.getElementById('cart-count');
        
        if (cartBadge) {
            cartBadge.innerText = cart.reduce((total, item) => total + item.quantity, 0);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('wishlist-container');
        const emptyMessage = document.getElementById('empty-wishlist');

        function displayWishlist() {
            let wishlist = JSON.parse(localStorage.getItem('plantWishlist')) || [];
            container.innerHTML = '';

            if (wishlist.length === 0) {
                emptyMessage.classList.remove('d-none');
                return;
            }

            emptyMessage.classList.add('d-none');

            wishlist.forEach((plant, index) => {
                const card = document.createElement('div');
                card.className = 'col-md-4 col-sm-6';
                card.innerHTML = `
                    <div class="card h-100 shadow-sm custom-plant-card">
                        <img src="${plant.img}" class="card-img-top plant-img" alt="${plant.name}" style="height: 250px; object-fit: cover;">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold plant-title">${plant.name}</h5>
                            <span class="fw-bold d-block mb-3 plant-price"><i class="fa-solid fa-indian-rupee-sign"></i> ${plant.price}</span>
                            <div class="d-flex gap-2 justify-content-center align-items-center">
                                <button class="btn btn-success rounded-pill flex-grow-1" onclick="moveToCart('${plant.name}', '${plant.price}', '${plant.img}', ${index})">Add to Cart</button>
                                <button class="btn btn-danger wishlist-btn" onclick="removeFromWishlist(${index})" style="border-radius: 50% !important; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0;">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.removeFromWishlist = function (index) {
            let wishlist = JSON.parse(localStorage.getItem('plantWishlist')) || [];
            wishlist.splice(index, 1);
            localStorage.setItem('plantWishlist', JSON.stringify(wishlist));
            displayWishlist();
        };

        window.moveToCart = function (name, price, img, index) {
            let cart = JSON.parse(localStorage.getItem('plantCart')) || [];
            
            if (!cart.some(item => item.name === name)) {
                cart.push({ name, price, img, quantity: 1 });
                localStorage.setItem('plantCart', JSON.stringify(cart));
                alert(name + " added to Cart!");
            } else {
                alert(name + " is already in Cart!");
            }
        };

        displayWishlist();
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
